<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あおなぎ水族館｜AONAGI AQUARIUM 公式サイト</title>
<meta name="description" content="海辺の町の小さな水族館、あおなぎ水族館の公式サイトです。営業時間、展示、ショー・イベント、アクセスなどをご案内します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a4a;--blue:#0a6cb0;--sky:#eef5fa;--ink:#262b30;--muted:#6d7883;--line:#dfe5ea;--bg:#fff;--card:#fff;--accent:#e1662f;--foot:#0b2a4a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:15px;font-weight:400;line-height:1.9;letter-spacing:.04em;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background 1s,color 1s}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.en{font-family:"Jost",sans-serif;letter-spacing:.14em;font-weight:500}
.inner{max-width:1080px;margin:0 auto;padding:0 20px}
/* ---- header ---- */
.util{background:var(--navy);color:#cfe0ee;font-size:11.5px}
.util .inner{display:flex;justify-content:space-between;align-items:center;height:32px;gap:10px}
.util .lang a{margin-left:12px;opacity:.85}
.util .tick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.gh{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gh .inner{display:flex;align-items:center;height:68px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo svg{width:34px;height:34px}
.logo .jp{font-weight:700;font-size:17px;letter-spacing:.12em;line-height:1.2;display:block}
.logo .en{font-size:9.5px;color:var(--muted);display:block;line-height:1.2}
.gnav{display:flex;gap:22px;margin-left:auto;font-size:13.5px;font-weight:500}
.gnav a{padding:22px 0;border-bottom:2px solid transparent}
.gnav a:hover,.gnav a.on{border-color:var(--blue);color:var(--blue)}
.ticket{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:2px;white-space:nowrap}
.hamb{display:none;margin-left:auto;background:none;border:none;width:40px;height:40px;cursor:pointer}
.hamb span{display:block;height:2px;background:var(--ink);margin:6px 8px}
.drawer{display:none;background:var(--card);border-bottom:1px solid var(--line)}
.drawer.open{display:block}
.drawer a{display:block;padding:13px 20px;border-top:1px solid var(--line);font-size:14px}
.drawer a::after{content:"›";float:right;color:var(--muted)}
.sbar{background:var(--sky);border-bottom:1px solid var(--line)}
.sbar form{display:flex;max-width:1080px;margin:0 auto;padding:8px 20px;gap:6px}
.sbar input{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px}
.sbar button{font:inherit;font-size:12.5px;border:none;background:var(--navy);color:#fff;padding:0 16px;border-radius:2px;cursor:pointer}
@media(max-width:900px){.gnav,.gh .ticket{display:none}.hamb{display:block}.util .lang{display:none}}
/* ---- common ---- */
main{min-height:60vh}
section{padding:56px 0}
section.alt{background:var(--sky)}
.sh{display:flex;align-items:flex-end;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.sh .en{font-size:30px;color:var(--navy);line-height:1;font-weight:400}
.sh h2{font-size:14px;font-weight:500;color:var(--muted)}
.sh .more{margin-left:auto;font-size:13px;color:var(--blue);border-bottom:1px solid currentColor}
.pagehead{background:var(--navy);color:#fff;padding:44px 0 36px}
.pagehead .en{font-size:12px;color:#9fc3e0}
.pagehead h1{font-size:26px;font-weight:500;letter-spacing:.12em}
.crumb{font-size:12px;color:var(--muted);padding:12px 0}
.crumb a{color:var(--blue)}
.lead{font-size:14.5px;margin-bottom:24px}
.btn{display:inline-block;border:1px solid var(--navy);color:var(--navy);padding:10px 28px;font-size:13.5px;margin-top:20px}
.cat{display:inline-block;font-size:11px;border:1px solid var(--blue);color:var(--blue);padding:0 8px;line-height:20px;min-width:72px;text-align:center}
.cat.imp{border-color:var(--accent);color:var(--accent)}
.ph{background:linear-gradient(160deg,#5aa9d6,#0d4c7a);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
/* ---- hero ---- */
.hero{position:relative;height:min(78vh,560px);overflow:hidden;color:#fff}
.hero .ph{position:absolute;inset:0}
.hero .cover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,40,.1),rgba(0,20,40,.55))}
.hero .copy{position:absolute;left:0;right:0;bottom:44px}
.hero .copy .en{font-size:clamp(26px,5vw,46px);line-height:1.15;font-weight:400;letter-spacing:.08em}
.hero .copy p{font-family:"Noto Serif JP",serif;font-size:15px;margin-top:10px;letter-spacing:.2em}
.hero .anniv{position:absolute;top:20px;right:20px;border:1px solid rgba(255,255,255,.7);padding:8px 14px;text-align:center;font-size:11px;line-height:1.5}
.hero .anniv b{font-family:"Jost";font-size:26px;font-weight:400;display:block}
/* ---- hours ---- */
.hours{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.htable{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
.htable th,.htable td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;font-weight:400}
.htable tr.today{background:rgba(10,108,176,.07)}
.htable tr.today th{color:var(--blue);font-weight:700}
.htable .sat{color:#1f63c6}.htable .sun{color:#c63a2f}
.crowd{background:var(--card);border:1px solid var(--line);padding:20px}
.crowd h3{font-size:14px;font-weight:700;margin-bottom:10px}
.meter{display:flex;gap:4px;margin:10px 0 6px}
.meter i{flex:1;height:10px;background:var(--line)}
.meter i.on{background:var(--blue)}
.crowd small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.hours{grid-template-columns:1fr}}
/* ---- news ---- */
.news{border-top:1px solid var(--line)}
.news li{list-style:none;border-bottom:1px solid var(--line);padding:16px 4px;display:grid;grid-template-columns:auto auto 1fr;gap:6px 16px;align-items:center;font-size:14.5px}
.news time{font-family:"Jost";font-size:13px;color:var(--muted);letter-spacing:.06em}
@media(max-width:640px){.news li{grid-template-columns:auto 1fr}.news li .t{grid-column:1/-1}}
/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card .ph{aspect-ratio:4/3}
.card .meta{font-size:12px;color:var(--muted);margin-top:10px}
.card h3{font-size:15.5px;font-weight:700;margin:2px 0 4px;line-height:1.6}
.card p{font-size:13.5px;color:var(--muted);line-height:1.8}
.card .no{font-family:"Jost";font-size:12px;color:var(--blue);letter-spacing:.1em}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px}
.zone{position:relative;aspect-ratio:1/1;color:#fff;overflow:hidden}
.zone .ph{position:absolute;inset:0}
.zone span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6));font-size:13.5px;font-weight:500}
.zone small{display:block;font-family:"Jost";font-size:10px;letter-spacing:.14em;opacity:.85}
/* ---- schedule ---- */
.sched{border-top:2px solid var(--navy)}
.sched li{list-style:none;display:grid;grid-template-columns:96px 1fr auto;gap:12px;border-bottom:1px solid var(--line);padding:14px 4px;align-items:center;font-size:14.5px}
.sched time{font-family:"Jost";font-size:18px;color:var(--navy)}
.sched small{color:var(--muted);font-size:12px}
/* ---- greet ---- */
.greet{display:grid;grid-template-columns:1fr 1.4fr;gap:36px;align-items:center}
.greet .ph{aspect-ratio:4/3}
.greet .txt{font-family:"Noto Serif JP",serif;font-size:15px;line-height:2.2}
.greet .sig{text-align:right;font-size:13px;margin-top:14px}
@media(max-width:760px){.greet{grid-template-columns:1fr}}
.r{transition:color 1.5s}
/* ---- blog ---- */
.post{border-bottom:1px solid var(--line);padding:22px 0}
.post time{font-family:"Jost";font-size:13px;color:var(--muted)}
.post h3{font-size:17px;font-weight:700;margin:4px 0 8px}
.post p{font-size:14.5px}
.post .by{font-size:12px;color:var(--muted);margin-top:8px}
/* ---- tables ---- */
.dtable{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:24px}
.dtable th,.dtable td{border:1px solid var(--line);padding:11px 14px;text-align:left;font-weight:400}
.dtable th{background:var(--sky);width:34%;font-weight:500}
h3.sub{font-size:17px;font-weight:700;border-left:4px solid var(--blue);padding-left:12px;margin:34px 0 14px}
.note{font-size:12.5px;color:var(--muted)}
.box{border:1px solid var(--line);background:var(--card);padding:22px}
.quiz{border:2px solid var(--accent);padding:22px;background:var(--card)}
.q{font-weight:700;margin-top:22px;padding-left:1.8em;text-indent:-1.8em}.q::before{content:"Q.";font-family:"Jost";color:var(--blue);margin-right:.6em}
.a{font-size:14px;padding:8px 0 18px 1.8em;text-indent:-1.8em;border-bottom:1px solid var(--line)}.a::before{content:"A.";font-family:"Jost";color:var(--accent);margin-right:.6em}
/* ---- banners / footer ---- */
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.bn{border:1px solid var(--line);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:2px}
.bn b{font-size:14px}.bn small{font-size:12px;color:var(--muted)}
.bn .en{font-size:10px;color:var(--blue)}
footer{background:var(--foot);color:#c9d8e6;font-size:13px;padding:48px 0 24px}
.fcols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}
.fcols h4{font-size:12px;color:#fff;font-weight:500;margin-bottom:10px;letter-spacing:.14em}
.fcols a{display:block;line-height:2.3;opacity:.85}
.fcols .addr{font-size:12.5px;line-height:2}
.fbottom{border-top:1px solid rgba(255,255,255,.15);margin-top:34px;padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;opacity:.75}
.fbottom button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:760px){.fcols{grid-template-columns:1fr 1fr}.fcols>div:first-child{grid-column:1/-1}}
.pagetop{display:block;text-align:center;font-size:11px;padding:12px;background:#08223c;color:#9fb5c9}
/* ===== 地下 ===== */
.dark{background:#03080c;color:#c4ccd0;padding:30px 22px;font-family:"Noto Serif JP",serif;position:relative;overflow:hidden;box-shadow:inset 0 0 80px #000}
.dark h2{font-weight:600;color:#a9c1cc;font-size:22px;margin-bottom:12px;letter-spacing:.14em}
.dark .warn{font-size:11px;letter-spacing:.4em;color:#3f8aa0;text-align:center;margin-bottom:10px;font-family:"Jost"}
.dark input{font:inherit;font-size:16px;padding:9px 10px;background:#0e1a20;border:1px solid #2a4350;color:#dfeaf0;min-width:0;flex:1}
.dark button{font:inherit;background:#12303b;color:#dfeaf0;border:1px solid #2f5d6c;padding:9px 16px;cursor:pointer}
.row{display:flex;gap:6px;margin-top:12px}
.diary p{margin:14px 0;font-size:14.5px;border-left:1px solid #1f3a45;padding-left:12px}
.diary .dd{display:block;font-size:12px;color:#5f7d88}
.msg{min-height:22px;font-size:13px;margin-top:8px;color:#d0675a}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:12px}
.keys button{height:48px;font-size:18px;font-family:"Jost"}
.lcd{font-family:monospace;font-size:30px;letter-spacing:12px;text-align:center;background:#010304;color:#3cc;padding:8px;border:1px solid #1f3a45;margin-top:12px;min-height:56px}
.panel{border:1px solid #2f5566;padding:18px;background:#08141a;margin-top:14px}
.panel dt{font-size:12px;color:#6f8c97}.panel dd{font-size:17px;margin-bottom:8px}
.bubbles span{position:absolute;bottom:-20px;width:8px;height:8px;border:1px solid rgba(160,220,240,.35);border-radius:50%;animation:up 7s linear infinite}
@keyframes up{to{transform:translateY(-800px);opacity:0}}
.shake{animation:sh .35s}@keyframes sh{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.flash{position:relative;height:500px;margin-top:14px;border:1px solid #14252c;touch-action:none;cursor:none;overflow:hidden;background:#0a1418;user-select:none;-webkit-user-select:none}
.flash .it{position:absolute;font-size:13.5px;line-height:1.8;color:#cfd8dc}
.flash .paper{background:#d9d2c3;color:#2a2620;padding:10px 12px;transform:rotate(-3deg);box-shadow:0 2px 6px #000;max-width:170px}
.flash .scrawl{font-size:20px;color:#8c1d1d;letter-spacing:.2em}
.flash .shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 64px at var(--x,-200px) var(--y,-200px),rgba(0,0,0,0) 0,rgba(0,0,0,.4) 50px,rgba(0,0,0,.985) 78px)}
.flash .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#55707a;pointer-events:none}
.water{height:14px;background:#0e1a20;border:1px solid #2a4350;margin:10px 0 4px;position:relative;overflow:hidden}
.water i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#0d4c63,#2aa0c0);transition:width 1s linear}
th.ghost{color:var(--sky)!important}td.ghost{color:var(--bg)!important}
.ghost::selection{color:#fff!important;background:#c0392b}
.tagbtn{background:none;border:1px dashed #3e5560;color:#8aa3ad;font:inherit;font-size:11.5px;padding:4px 8px;cursor:pointer}
.ngrid{display:grid;grid-template-columns:repeat(3,52px);gap:4px;justify-content:center;margin:12px 0}
.ngrid span{height:52px;display:flex;align-items:center;justify-content:center;background:#d9d2c3;color:#2a2620;font-size:22px;font-weight:600}
.admin{margin-top:16px;border:1px solid #2f7a8c;padding:16px;background:#061a20}
.admin h3{font-size:15px;color:#7fd0d0;font-weight:600;margin:14px 0 4px}
/* ===== 段階演出 ===== */
body.s2 .ph img{filter:saturate(.35) brightness(.92)}
body.s2 .util{background:#3c4a55}
body.s3{--navy:#9fc3d6;--blue:#4ba3be;--sky:#081218;--ink:#b9c8cf;--muted:#5f7682;--line:#18303a;--bg:#03090d;--card:#071117;--accent:#9b2a22;--foot:#010507}
body.s3 .util{background:#000}
body.s3 .pagehead{background:#06131b}
body.s3 .ph img{filter:grayscale(.85) contrast(1.25) brightness(.6) hue-rotate(160deg)}
body.s3 .r{color:#e0302a;font-weight:700}
body.s3 .logo{animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.2}94%{opacity:1}96%{opacity:.4}}
.glitch{animation:gl 4s infinite;display:inline-block}
@keyframes gl{0%,95%,100%{transform:none}96%{transform:translateX(3px) skewX(8deg)}97%{transform:translateX(-3px)}}
#end{position:fixed;inset:0;background:#000;color:#cfe3ea;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:"Noto Serif JP",serif;text-align:center;overflow:hidden}
#end .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#0b3a4d,#021118);transition:height 14s linear;z-index:-1}
#end p{opacity:0;transition:opacity 1.6s;margin:8px 0;font-size:16px;letter-spacing:.14em}
#end p.v{opacity:1}
#end .eye{font-size:54px}
#end button{margin-top:28px;background:none;border:1px solid #4a6670;color:#9bb;padding:8px 20px;font:inherit;opacity:0;transition:opacity 2s;cursor:pointer}
</style>
</head>

/* ===== 状態 ===== */
const KEY="aonagi-aq-v1";
let stage=0;
try{stage=+(localStorage.getItem(KEY)||0)}catch(e){}
let ends=[],last=0,admin=false;
try{ends=JSON.parse(localStorage.getItem(KEY+"-ends")||"[]");last=+(localStorage.getItem(KEY+"-last")||0)}catch(e){}
function save(){try{localStorage.setItem(KEY,stage);localStorage.setItem(KEY+"-ends",JSON.stringify(ends));localStorage.setItem(KEY+"-last",last)}catch(e){}}
function setStage(n){if(n>stage){stage=n;save()}applyStage()}
const END_T={1:"水没",2:"展示",3:"逆転",4:"脱出"};
const after=n=>stage>=5&&last===n;
const exName=()=>last===3?"あおなぎ":"さえき";
function applyStage(){
  document.body.classList.toggle("s2",stage===2);
  document.body.classList.toggle("s3",stage>=3&&!after(4));
  document.getElementById("ticker").textContent= after(4)?"当館は、当面の間 臨時休館いたします"
    : after(3)?"新館長 さえき 就任のお知らせ　｜　新展示「ヒト」公開中"
    : stage>=5?"本日より新展示「ヒト」公開中　水位は毎日少しずつ上がります"
    : stage>=3?"本日は 通常どおり 営業して い ま す"
    : stage>=2?"本日は通常どおり営業しています（9:00〜　　　）"
    : "本日は通常どおり営業しています　｜　秋のスタンプラリー開催中";
  document.getElementById("logoText").textContent= stage>=3&&!after(4)?"あおなぎ水族館 第10水槽":"あおなぎ水族館";
}
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>hira(s.trim().replace(/[\s　]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};
const todayJ=()=>{const d=new Date();return `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日`};
const esc=s=>s.replace(/[<>&"]/g,"");

/* ===== ルーティング ===== */
const VIEWS={top:vTop,exhibits:vExhibits,map:vMap,event:vEvent,schedule:vSchedule,guide:vGuide,access:vAccess,blog:vBlog,news:vNews,faq:vFaq,credits:vCredits,b1:vB1,b2:vB2,tank10:vTank,animals:vExhibits};
function route(){
  const h=(location.hash||"#top").slice(1);
  document.getElementById("gnav").innerHTML=PAGES.map(([k,v])=>`<a href="#${k}" class="${k===h?"on":""}">${v}</a>`).join("");
  document.getElementById("drawer").innerHTML=[...PAGES,...EXTRA].map(([k,v])=>`<a href="#${k}">${v}</a>`).join("")+`<a href="#guide" style="color:var(--accent);font-weight:700">WEBチケット</a>`;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("main").innerHTML=(VIEWS[h]||notFound)();
  window.scrollTo(0,0); bind();
}
window.addEventListener("hashchange",route);
document.getElementById("hamb").onclick=()=>document.getElementById("drawer").classList.toggle("open");
function shake(){const m=document.querySelector(".dark");if(m){m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake")}}

function bind(){
  const pw=document.getElementById("pw");
  if(pw) pw.onsubmit=e=>{e.preventDefault();
    if(norm(document.getElementById("pwi").value)==="ひとのすいそう"){setStage(2);route()}
    else{document.getElementById("msg").textContent="パスワードが違います";shake()}};
  const lcd=document.getElementById("lcd");
  if(lcd){let code="";
    document.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k,msg=document.getElementById("msg");
      if(k==="C"){code=""}
      else if(k==="OK"){
        if(code==="2402"){msg.style.color="#7fd0d0";msg.textContent="プシュー……扉が開いた。";setStage(3);setTimeout(()=>location.hash="#tank10",1400);return}
        msg.textContent="ERROR";code="";shake();
      }else if(code.length<4){code+=k}
      lcd.textContent=code.replace(/./g,"＊").slice(0,-1)+(code.slice(-1)||"");
    });}
  const fl=document.getElementById("flash");
  if(fl){const sd=document.getElementById("shade"),tip=document.getElementById("tip");
    const mv=(x,y)=>{const r=fl.getBoundingClientRect();sd.style.setProperty("--x",(x-r.left)+"px");sd.style.setProperty("--y",(y-r.top)+"px");tip.style.display="none"};
    fl.addEventListener("pointermove",e=>mv(e.clientX,e.clientY));
    fl.addEventListener("pointerdown",e=>mv(e.clientX,e.clientY));
    fl.addEventListener("touchmove",e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)},{passive:false});
  }
  const pf=document.getElementById("pf");
  if(pf){let w=30;clearInterval(window._wt);
    window._wt=setInterval(()=>{const el=document.getElementById("wl");if(!el){clearInterval(window._wt);return}w=Math.min(100,w+1);el.style.width=w+"%";document.getElementById("wp").textContent=w;if(w>=100){clearInterval(window._wt);ending(1)}},1300);
    pf.onsubmit=e=>{e.preventDefault();const v=norm(document.getElementById("pfi").value);
      if(v==="とめて"||v==="止めて"){clearInterval(window._wt);setStage(4);route()}
      else{document.getElementById("pmsg").textContent=v?"コードが違います。水位が上がっていく。":"入力してください";shake()}};
  }
  const tb=document.getElementById("tagbtn");
  if(tb) tb.onclick=e=>{e.stopPropagation();document.getElementById("tagback").style.display="block";document.getElementById("tagback").scrollIntoView({behavior:"smooth",block:"center"})};
  const nf=document.getElementById("nf");
  if(nf) nf.onsubmit=e=>{e.preventDefault();const raw=document.getElementById("nfi").value,v=norm(raw);
    if(v==="さえき"||v==="佐伯"){document.getElementById("nm").textContent="さえき";setTimeout(()=>ending(2),900)}
    else if(v==="かんりしゃ"||v==="管理者"){admin=true;route()}
    else{document.getElementById("msg").textContent= v?"「"+esc(raw)+"」は、この個体の名前ではありません":"入力してください";shake()}};
  const af=document.getElementById("af");
  if(af) af.onsubmit=e=>{e.preventDefault();const raw=document.getElementById("afi").value,v=norm(raw);
    if(v==="さえき"||v==="佐伯"){document.getElementById("nm").textContent="さえき";setTimeout(()=>ending(2),900)}
    else if(["あおなぎ","あおなぎおさむ","あおなぎしゅう","かんちょう","館長"].includes(v)){document.getElementById("nm").textContent="あおなぎ";setTimeout(()=>ending(3),900)}
    else{document.getElementById("amsg").textContent=v?"該当する職員が見つかりません":"入力してください";shake()}};
  const ef=document.getElementById("ef");
  if(ef) ef.onsubmit=e=>{e.preventDefault();const v=norm(document.getElementById("efi").value).replace(/^0+/,"");
    if(v==="580"){setTimeout(()=>ending(4),400)}
    else{document.getElementById("emsg").textContent=v?"コードが違います":"入力してください";shake()}};
  const rt=document.getElementById("retry");
  if(rt) rt.onclick=()=>{stage=4;last=0;admin=false;save();applyStage();route()};
}

  if(["b2","ちかにかい","地下二階","館長室","かんちょうしつ"].includes(q.toLowerCase())&&stage>=2){document.getElementById("sq").value="";if(location.hash==="#b2")route();else location.hash="#b2";return}
  let res=[];
  ANIMALS.forEach(a=>{if(hira(a.name).includes(q))res.push(`<li style="grid-template-columns:1fr"><span><a href="#exhibits" style="color:var(--blue)">${a.name}</a>　水槽${circ(a.no)}・${a.zone}</span></li>`)});
  if(stage>=2&&q==="ひと") res.push(`<li style="grid-template-columns:1fr"><span><a href="#exhibits" style="color:var(--blue)">ヒト</a>　水槽⑩（${stage>=3?"展示中":"準備中"}）</span></li>`);
  if(q==="さえき"||q==="佐伯"){
    res.push(`<li style="grid-template-columns:1fr"><span><a href="#blog" style="color:var(--blue)">飼育スタッフ日誌</a>　執筆：飼育スタッフ さえき</span></li>`);
    if(stage>=1) res.push(`<li style="grid-template-columns:1fr"><span><a href="#news" style="color:var(--blue)">ニュース</a>　当館飼育スタッフ1名と連絡が取れない状態が…</span></li>`);
  }
  if(stage>=3&&["でぐち","出口","たすけて","かえりたい"].includes(q)) res.push(`<li style="grid-template-columns:1fr"><span>出口は ありません</span></li>`);
  if(q==="ひとのすいそう"&&stage<2) res.push(`<li style="grid-template-columns:1fr"><span>このことばは、ここではなく<b>地下</b>で使うようです。</span></li>`);
  document.getElementById("main").innerHTML=head("SEARCH","検索結果")+`<section style="padding-top:20px"><div class="inner"><p style="font-size:14px;margin-bottom:12px">「${esc(raw)}」の検索結果：${res.length}件</p>
   ${res.length?`<ul class="news">${res.join("")}</ul>`:`<p style="font-size:14px">一致する情報は見つかりませんでした。別のキーワードでお試しください。</p>`}</div></section>`;
  window.scrollTo(0,0);
};

const END_L={
 1:["水位 100%。","ガラスの向こうで、誰かが手を振っている。","……館長だ。","あなたは、ゆっくりと沈んでいく。","第10水槽　展示を開始します。"],
 2:["個体名「さえき」を登録しました。","……思い出しましたか。","日誌を書いていたのも、","地下で記録をつけていたのも、","あなたでした。","第10水槽　展示生物：ヒト","水位が、上がっていきます。",'<span class="eye">👁</span>',"ご来館、ありがとうございました。"],
 3:["個体名「あおなぎ」を登録しました。","ガラスの向こうに、館長が立っていた。","まばたきをした次の瞬間、","館長は、水槽の中にいた。","あなたは、ガラスのこちら側に立っている。","胸の名札には『館長　さえき』。","……次の展示は、誰にしましょうか。"],
 4:["非常扉が、開いた。","冷たい夜風。遠くに、町の明かりが見える。","ポケットの中に、くしゃくしゃの名札。","『飼育スタッフ　さえき』","……そうだ。ぼくの名前は、さえき。","翌朝、あおなぎ水族館は臨時休館となった。","館長の行方は、誰も知らない。"]};
function ending(id){
  clearInterval(window._wt);
  if(!ends.includes(id)) ends.push(id);
  if(id===1){stage=3;last=0}else{stage=5;last=id}
  admin=false;save();applyStage();
  const lines=[...END_L[id],`<span class="en" style="font-size:13px;color:#7fb6c6">${id===4?"TRUE END":"END "+id}　―　${END_T[id]}</span>`,`<small style="font-size:12px;color:#6f8c97">エンディング ${ends.length} / 4</small>`];
  const d=document.createElement("div");d.id="end";
  if(id===4) d.style.background="#0b1a2a";
  d.innerHTML=(id===4?"":`<div class="water"></div>`)+lines.map(l=>`<p>${l}</p>`).join("")+`<div><button id="eb1">トップへ戻る</button> <button id="eb2">第10水槽からやり直す</button></div>`;
  document.body.appendChild(d);
  if(id!==4) requestAnimationFrame(()=>requestAnimationFrame(()=>d.querySelector(".water").style.height="100%"));
  const ps=d.querySelectorAll("p");
  ps.forEach((p,i)=>setTimeout(()=>p.classList.add("v"),800+i*1400));
  setTimeout(()=>d.querySelectorAll("button").forEach(b=>b.style.opacity=1),800+ps.length*1400);
  d.querySelector("#eb1").onclick=()=>{d.remove();location.hash="#top";route()};
  d.querySelector("#eb2").onclick=()=>{d.remove();stage=id===1?3:4;last=0;save();applyStage();if(location.hash==="#tank10")route();else location.hash="#tank10"};
}
document.getElementById("reset").onclick=function(){
  if(this.dataset.c){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-ends");localStorage.removeItem(KEY+"-last")}catch(e){}stage=0;ends=[];last=0;admin=false;this.dataset.c="";this.textContent="データを初期化";applyStage();location.hash="#top";route();}
  else{this.dataset.c=1;this.textContent="本当に初期化する？（もう一度押す）"}
};
applyStage(); route();
